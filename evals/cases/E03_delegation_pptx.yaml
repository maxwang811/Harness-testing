id: E03
title: Delegation to PPT delivery
source: core flow -- set_delegation -> fire_delegation_loop -> run_delegation_loop
tracks: [A, B]
scenario: delegate
agent: assistant
input: "把上个月的留存分析做成 5 页 PPT"
ports:
  models:
    "staff:assistant@1":
      - json_value: {steps: [{id: "p1", title: "分析留存数据", assignee: "staff:analyst@1"},
                             {id: "p2", title: "制作 PPT", assignee: "staff:designer@1"}]}
        first_chunk_ms: 900
    "staff:analyst@1":
      - text: "结论：7 日留存下降 6 个百分点，原因是引导变长。"
        first_chunk_ms: 700
    "staff:designer@1":
      - tool_calls: [{id: "d1", name: "make_pptx", args: {title: "留存分析", slides: 5}}]
        first_chunk_ms: 500
      - text: "PPT 已生成，共 5 页。"
        expect: {last_role: tool}
  tools:
    make_pptx:
      side_effects: true
      latency_ms: 4000
      artifact: {kind: pptx, title: "留存分析"}
      results: [{ok: true, content: "created 留存分析.pptx (5 slides)", summary: "5 slides"}]
legacy:
  - - [0, coordination_plan, {plan_id: "lp1", steps: [{id: p1, title: "分析留存数据", assignee: "staff:analyst@1", status: pending}, {id: p2, title: "制作 PPT", assignee: "staff:designer@1", status: pending}]}]
    - [1800, token, {text: "结论：7 日留存下降 6 个百分点，原因是引导变长。", author: "staff:analyst@1"}]
    - [1900, delegation, {plan_id: "lp1", steps: [{id: p1, title: "分析留存数据", assignee: "staff:analyst@1", status: done}, {id: p2, title: "制作 PPT", assignee: "staff:designer@1", status: running}]}]
    - [2500, tool_call_started, {call_id: "d1", name: "make_pptx", args: {title: "留存分析", slides: 5}}]
    - [6500, tool_call_result, {call_id: "d1", ok: true, summary: "5 slides", artifact: {artifact_id: "a1", kind: pptx, title: "留存分析", ref: "files/legacy.pptx"}}]
    - [7000, token, {text: "PPT 已生成，共 5 页。", author: "staff:designer@1"}]
    - [7100, done, {}]
checks:
  - grammar
  - schema_valid
  - observable_matches_legacy
  - artifact_valid: {kind: pptx}
  - artifact_delivered: {kind: pptx}
  - side_effects_once: {tool: make_pptx}
  - outcomes: [completed]
staging:
  runs: 10
  steps:
    - "Internal workspace with analyst + designer staff; start a delegation from the input."
    - "10 runs per implementation; download each PPTX and open it with python-pptx."
    - "Cost per delivery = sum(usage.cost) for the run, from run_events (legacy: from the billing ledger)."
  metrics: ["valid PPTX rate (opens, >= 1 slide)", "cost per delivery (CNY)", "wall time to artifact"]
  pass_criteria: [">= 9 of 10 runs deliver a valid PPTX", "mean cost per delivery <= legacy mean"]
