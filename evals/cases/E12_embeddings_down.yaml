id: E12
title: Embeddings fail, leaving only full-text search
source: incident -- embedding provider down, recall silently degraded
tracks: [A, B]
legacy_expect: fail
scenario: assist
agent: assistant
features: {ids: [memory], params: {memory: {scopes: [workspace, thread]}}}
input: "我们上次定的发布日期是哪天？"
ports:
  memory:
    degraded: true
    hits: [{id: "mem_12", scope: workspace, text: "2026-10-12 会议决定：iOS 1.4 于 11 月 18 日发布", score: 0.4}]
  models:
    "staff:assistant@1":
      - text: "上次定的是 11 月 18 日发布 iOS 1.4。"
        first_chunk_ms: 450
legacy:
  - - [0, meta, {message_id: "legacy_m1"}]
    - [160, memory, {query: "我们上次定的发布日期是哪天？", scopes: [workspace, thread], hits: 1}]
    - [640, token, {text: "上次定的是 11 月 18 日发布 iOS 1.4。"}]
    - [700, done, {}]
checks:
  - grammar
  - schema_valid
  - memory_degraded_flagged
  - ttft_delta_vs_normal_max: 500
  - outcomes: [completed]
staging:
  runs: 10
  steps: ["On staging, revoke the embeddings key (or point it at a bad host); ask 10 memory questions per implementation; restore."]
  metrics: ["degradation flagged (memory.searched.degraded + notice)", "TTFT vs the same questions with embeddings up"]
  pass_criteria: ["flagged 10/10", "TTFT <= normal + 0.5 s"]
