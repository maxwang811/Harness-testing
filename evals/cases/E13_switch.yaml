id: E13
title: Switching and rollback
source: the switch itself (HarnessRouter + cut points)
tracks: [A, B]
scenario: assist
agent: assistant
input: "给团队建个跟进任务：周五前更新竞品分析"
notes: >
  Offline: router semantics (header only for internal accounts, kill switch, stable buckets,
  per-run pinning, rollback within the 30 s rules cache) and a shadow run of loop-ref next to a
  legacy primary: tools replay, nothing billed, no files written, primary output unchanged.
ports:
  models:
    "staff:assistant@1":
      - tool_calls: [{id: "k1", name: "create_task", args: {title: "周五前更新竞品分析"}}]
      - text: "已创建任务 T-7：周五前更新竞品分析。"
  tools:
    create_task: {side_effects: true, results: [{ok: true, content: "task T-7 created", summary: "created T-7"}]}
legacy:
  - - [0, meta, {message_id: "legacy_m1"}]
    - [300, tool_call_started, {call_id: "k1", name: "create_task", args: {title: "周五前更新竞品分析"}}]
    - [500, tool_call_result, {call_id: "k1", ok: true, summary: "created T-7"}]
    - [900, token, {text: "已创建任务 T-7：周五前更新竞品分析。"}]
    - [1000, done, {}]
checks:
  - grammar
  - schema_valid
  - switch_and_shadow
staging:
  runs: 20
  steps:
    - "Pin 5 runs with X-Harness from an internal account; send the same header from a non-internal account and confirm it is ignored."
    - "Turn on shadow for internal workspaces at 100 %; run 10 messages; check shadow runs wrote no messages and no billing rows."
    - "Flip the kill switch; time until new runs report legacy in the run record; an interrupted canary run must continue on its pinned implementation."
  metrics: ["routing decision per run (run record)", "messages/billing rows written by shadow runs", "seconds from kill switch to legacy"]
  pass_criteria: ["pins and shadows invisible to users", "shadow writes 0 messages and bills 0", "rollback <= 30 s"]
