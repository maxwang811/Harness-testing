id: E07
title: "Derong, 10-22: network drop mid-reply in home chat"
source: incident 2026-10-22 (Derong) -- reply lost or duplicated, 「无法连接到 Captain」 shown
tracks: [A, B]
legacy_expect: fail
scenario: home
agent: assistant
input: "帮我写一段给客户的延期说明"
client: {disconnect_after_seq: 5}
notes: >
  The reader drops after seq 5 (mid-reply), the run must finish without a reader, and the client
  re-attaches with after_seq (Last-Event-ID) and sees every event exactly once. Legacy stand-in:
  the stream ends in an error after the drop, as in the incident.
ports:
  models:
    "staff:assistant@1":
      - chunks: ["王总您好：", "由于第三方接口延迟，", "交付时间需要顺延一周，", "至 11 月 6 日。", "给您带来不便深表歉意。"]
        first_chunk_ms: 400
        chunk_ms: 300
legacy:
  - - [0, meta, {message_id: "legacy_m1"}]
    - [430, token, {text: "王总您好："}]
    - [730, token, {text: "由于第三方接口延迟，"}]
    - [9000, error, {message: "无法连接到 Captain"}]
checks:
  - grammar
  - schema_valid
  - reattach_exact
  - outcomes: [completed]
staging:
  runs: 10
  steps:
    - "iOS on a real device, home chat, long reply; toggle airplane mode for 5 s at the 2nd sentence."
    - "Same on web with DevTools 'Offline' for 5 s."
    - "Check the saved message once the run finishes and what the client shows after reconnect."
  metrics: ["replies lost", "replies duplicated", "error copy shown"]
  pass_criteria: ["0 lost, 0 duplicated", "「无法连接到 Captain」 never appears", "reconnect resumes the same message_id"]
