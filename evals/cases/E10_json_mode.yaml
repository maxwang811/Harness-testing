id: E10
title: GLM on SiliconFlow rejects JSON mode
source: incident -- planning failed on the first call when json_object was sent to SiliconFlow GLM
tracks: [A]
scenario: delegate
agent: assistant
agent_patch: {model_policy: {fallback: ["siliconflow/glm-4.6"]}}
input: "把上个月的留存分析做成 5 页 PPT"
notes: >
  Harness side: the plan is requested abstractly (response_format=json) in exactly one call.
  Port side: a route without JSON mode gets prompt-based JSON; the provider_flag check is the
  same assertion the adapter conformance suite runs against the real llm_client adapter.
  The incident only shows in port traffic, so the legacy stream passes the event-level checks.
ports:
  routes:
    "siliconflow/glm-4.6": {json_mode: false}
    "openrouter/glm-4.6": {}
  models:
    "staff:assistant@1":
      - json_value: {steps: [{id: "p1", title: "分析留存数据", assignee: "staff:analyst@1"},
                             {id: "p2", title: "制作 PPT", assignee: "staff:designer@1"}]}
    "staff:analyst@1":
      - text: "结论：7 日留存下降 6 个百分点。"
    "staff:designer@1":
      - tool_calls: [{id: "d1", name: "make_pptx", args: {title: "留存分析", slides: 5}}]
      - text: "PPT 已生成。"
  tools:
    make_pptx: {side_effects: true, artifact: {kind: pptx, title: "留存分析"}, results: [{ok: true, content: "created", summary: "5 slides"}]}
legacy:
  - - [0, notice, {code: planner_retry}]
    - [3000, coordination_plan, {plan_id: "lp1", steps: [{id: p1, title: "分析留存数据", assignee: "staff:analyst@1", status: pending}, {id: p2, title: "制作 PPT", assignee: "staff:designer@1", status: pending}]}]
    - [4000, token, {text: "结论：7 日留存下降 6 个百分点。", author: "staff:analyst@1"}]
    - [4500, tool_call_started, {call_id: "d1", name: "make_pptx", args: {title: "留存分析", slides: 5}}]
    - [5000, tool_call_result, {call_id: "d1", ok: true, summary: "5 slides", artifact: {artifact_id: "a1", kind: pptx, title: "留存分析", ref: "files/legacy.pptx"}}]
    - [5200, token, {text: "PPT 已生成。", author: "staff:designer@1"}]
    - [5300, done, {}]
checks:
  - grammar
  - schema_valid
  - model_calls: {purpose: plan, max: 1, response_format: json}
  - provider_flag: {purpose: plan, flag: json_mode, value: false}
  - artifact_delivered: {kind: pptx}
  - outcomes: [completed]
