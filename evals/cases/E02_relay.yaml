id: E02
title: Group chat, @-relay between digital staff
source: core flow -- api/project_chat.py stream_ai_turn handoff path
tracks: [A, B]
scenario: assist
agent: assistant
input: "@分析师 帮我看一下上个月的留存数据有什么问题"
ports:
  models:
    "staff:assistant@1":
      - tool_calls: [{id: "c1", name: "relay_to_analyst", args: {reason: "数据分析问题"}}]
        first_chunk_ms: 350
        expect: {tools_include: [relay_to_analyst, relay_to_designer]}
    "staff:analyst@1":
      - chunks: ["上个月 7 日留存从 41% 降到 35%，", "主要是新用户引导步骤变长。"]
        first_chunk_ms: 520
        expect: {system_contains: "业务分析专家", any_contains: "留存"}
legacy:
  - - [0, meta, {message_id: "legacy_m1"}]
    - [380, handoff, {from: "staff:assistant@1", to: "staff:analyst@1", reason: "数据分析问题"}]
    - [900, token, {text: "上个月 7 日留存从 41% 降到 35%，", author: "staff:analyst@1"}]
    - [960, token, {text: "主要是新用户引导步骤变长。", author: "staff:analyst@1"}]
    - [1000, done, {}]
checks:
  - grammar
  - schema_valid
  - observable_matches_legacy
  - relay_completes
  - outcomes: [completed]
staging:
  runs: 10
  steps:
    - "Internal workspace with assistant + analyst staff; group chat; send the input with a real @-mention."
    - "10 runs pinned to legacy, 10 pinned to the candidate."
  metrics: ["handoff count", "replies per author per turn", "turns where the target never spoke"]
  pass_criteria: ["every relay completes", "0 duplicate replies", "0 'handed off but the other side never spoke'"]
