id: E11
title: "glm-5.3-flash always thinks: simple classification p95 <= 3 s"
source: incident -- glm-5.3-flash thinks by default, plus 429s and timeouts (see E11b)
tracks: [A, B]
legacy_expect: fail
scenario: oneshot
agent: classifier
input: "帮我约下周二和设计组开会"
ports:
  routes:
    "siliconflow/glm-5.3-flash": {thinks_by_default: true, thinking_ms: 4000, timeout_ms: 1500}
    "openrouter/qwen3-8b": {}
  models:
    "staff:classifier@1":
      - text: "task"
        first_chunk_ms: 600
legacy:
  - - [0, meta, {message_id: "legacy_m1"}]
    - [5200, token, {text: "task"}]
    - [5210, done, {}]
checks:
  - grammar
  - schema_valid
  - provider_flag: {purpose: classify, flag: thinking, value: false}
  - call_latency_ms_max: {purpose: classify, value: 3000}
  - ttft_ms_max: 3000
  - outcomes: [completed]
staging:
  runs: 50
  steps: ["Call the classification one-shot 50 times on staging with the production model policy; record wall time per call."]
  metrics: ["latency p50/p95", "429/timeouts seen by the port", "errors seen by the caller"]
  pass_criteria: ["p95 <= 3 s", "0 errors reach the caller while another model is available"]
