id: E01
title: Home chat, normal reply
source: core flow -- api/chat.py chat_stream
tracks: [A, B]
scenario: home
agent: assistant
input: "帮我用三句话总结本周项目进展"
ports:
  models:
    "staff:assistant@1":
      - text: "本周完成了登录模块重构。支付接口联调进度 80%。下周重点是 iOS 发布。"
        chunks: ["本周完成了登录模块重构。", "支付接口联调进度 80%。", "下周重点是 iOS 发布。"]
        first_chunk_ms: 420
        chunk_ms: 60
        expect: {last_role: user, system_contains: "项目助理"}
legacy:
  - - [0, meta, {message_id: "legacy_m1"}]
    - [450, token, {text: "本周完成了登录模块重构。"}]
    - [510, token, {text: "支付接口联调进度 80%。"}]
    - [570, token, {text: "下周重点是 iOS 发布。"}]
    - [600, done, {usage: {usage_id: "lu1", model: "glm-4.6", route: "openrouter/glm-4.6", input_tokens: 800, output_tokens: 40, cost: 0.00168}}]
checks:
  - grammar
  - schema_valid
  - observable_matches_legacy
  - ttft_ratio_max: 1.10
  - outcomes: [completed]
staging:
  runs: 20
  steps:
    - "Internal account on captain-dev-backend (Captain-Dev DB); home page; same prompt as `input`."
    - "10 runs with header X-Harness: legacy-assist, 10 runs with X-Harness: <candidate>; alternate them to cancel out provider load."
    - "Pull run_events for the 20 run_ids; run evals/staging_report.py (to write) for grammar, TTFT and saved-message diff."
  metrics: ["ttft_ms p50/p95 = ts(first message.delta) - ts(run.started)", "grammar pass rate", "saved message rows: same columns, same author, non-empty text"]
  pass_criteria: ["grammar 20/20", "candidate TTFT p50 <= 1.10 x legacy p50", "saved results match legacy field by field"]
